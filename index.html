<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="apple-mobile-web-app-title" content="IRON LOG" />
<meta name="theme-color" content="#1A1917" />
<title>IRON LOG</title>
<link rel="manifest" href="/manifest.json" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="icon" href="/apple-touch-icon.png" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: #1A1917; overscroll-behavior: none; }
  #root { min-height: 100vh; min-height: 100dvh; }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: #201F1C; }
  ::-webkit-scrollbar-thumb { background: #5A554C; border-radius: 2px; }
  .ex-row { transition: background 0.2s; }
  .ex-row:active { background: #262420 !important; }
  .set-btn { transition: all 0.15s; cursor: pointer; border: none; }
  .set-btn:active { transform: scale(0.92); }
  .tab-btn { transition: all 0.2s; cursor: pointer; border: none; background: none; }
  .circle-btn { cursor: pointer; transition: all 0.2s; }
  .circle-btn:active { transform: scale(0.85); }
  @keyframes prFlash { 0%,100%{opacity:1} 50%{opacity:0.4} }
  @keyframes slideUp { from{transform:translateY(100%);opacity:0} to{transform:translateY(0);opacity:1} }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
</style>
</head>
<body>
<div id="root"></div>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback } = React;

const DAYS = {
  A: {
    label: "Day 1", short: "Push", subtitle: "Push — Chest, Shoulders, Triceps", color: "#5AC8DE",
    exercises: [
      { id: "p0", name: "Warm-Up", type: "WU", sets: 3, setLabels: ["Warmup", "Push-Ups", "Pull-Ups"], reps: null },
      { id: "p1", name: "Flat Bench Press", type: "STR", sets: 4, reps: "8–12" },
      { id: "p2", name: "Incline Dumbbell Press", type: "STR", sets: 3, reps: "10–12" },
      { id: "p3", name: "Overhead Shoulder Press", type: "STR", sets: 4, reps: "8–10" },
      { id: "p4", name: "Lateral Raises", type: "STR", sets: 3, reps: "12–15" },
      { id: "p5", name: "Tricep Pushdown", type: "STR", sets: 3, reps: "12–15" },
      { id: "p6", name: "Overhead Tricep Extension", type: "STR", sets: 3, reps: "10–12" },
      { id: "p7", name: "Incline Treadmill Walk", type: "CARDIO", sets: null, reps: "20 min" },
    ],
  },
  B: {
    label: "Day 2", short: "Pull", subtitle: "Pull — Back, Biceps, Rear Delts", color: "#6FCF7C",
    exercises: [
      { id: "u0", name: "Warm-Up", type: "WU", sets: 3, setLabels: ["Warmup", "Push-Ups", "Pull-Ups"], reps: null },
      { id: "u1", name: "Lat Pulldown", type: "STR", sets: 4, reps: "6–10" },
      { id: "u2", name: "Seated Cable Row", type: "STR", sets: 4, reps: "8–12" },
      { id: "u3", name: "Single-Arm Dumbbell Row", type: "STR", sets: 3, reps: "10–12" },
      { id: "u4", name: "Face Pulls", type: "STR", sets: 3, reps: "12–15" },
      { id: "u5", name: "Barbell Curl", type: "STR", sets: 3, reps: "10–12" },
      { id: "u6", name: "Hammer Curls", type: "STR", sets: 3, reps: "10–12" },
      { id: "u7", name: "Cycling", type: "CARDIO", sets: null, reps: "12–15 min" },
    ],
  },
  C: {
    label: "Day 3", short: "Legs", subtitle: "Legs", color: "#E8636B",
    exercises: [
      { id: "l0", name: "Warm-Up", type: "WU", sets: 3, setLabels: ["Warmup", "Push-Ups", "Pull-Ups"], reps: null },
      { id: "l1", name: "Barbell Squat", type: "STR", sets: 4, reps: "8–12" },
      { id: "l2", name: "Romanian Deadlifts", type: "STR", sets: 4, reps: "10–12" },
      { id: "l3", name: "Leg Press", type: "STR", sets: 3, reps: "10–15" },
      { id: "l4", name: "Leg Curls", type: "STR", sets: 3, reps: "10–12" },
      { id: "l5", name: "Walking Lunges", type: "STR", sets: 3, reps: "12/leg" },
      { id: "l6", name: "Calf Raises", type: "STR", sets: 4, reps: "15–20" },
      { id: "l7", name: "Normal Walking", type: "CARDIO", sets: null, reps: "5 min" },
    ],
  },
};

const TYPE_COLORS = { WU: "#D9A441", STR: "#a78bfa", CARDIO: "#34d399" };
const STORAGE_KEY = "gymlog_v5";
const DEFAULT_TAB = "A";

const EXERCISE_MEDIA = {
  p1: "Images/Barbell-Bench-Press.gif",
  p2: "Images/Incline-Dumbbell-Press.gif",
  p3: "Images/Standing-Dumbbell-Overhead-Press.gif",
  p4: "Images/Dumbbell-Lateral-Raise.gif",
  p5: "Images/Tricep-pushdown.jpg",
  p6: "Images/High-Pulley-Overhead-Tricep-Extension.gif",
  p7: "Images/Incline-Treadmill.gif",
  u1: "Images/Lat-Pulldown.gif",
  u2: "Images/Seated-Cable-Row.gif",
  u3: "Images/Dumbbell-Row.gif",
  u4: "Images/Face-Pull.gif",
  u5: "Images/Barbell-Curl.gif",
  u6: "Images/Seated-Hammer-Curl.gif",
  u7: "Images/Cycling.gif",
  l1: "Images/BARBELL-SQUAT.gif",
  l2: "Images/Barbell-Romanian-Deadlift.gif",
  l3: "Images/Leg-Press.gif",
  l4: "Images/Seated-Leg-Curl.gif",
  l5: "Images/bodyweight-lunges.gif",
  l6: "Images/Calfraises.jpg",
  l7: "Images/Treadmill-.gif",
};

function buildInitialState() {
  const state = {};
  for (const [dayKey, day] of Object.entries(DAYS)) {
    state[dayKey] = {};
    for (const ex of day.exercises) {
      state[dayKey][ex.id] = { sets: Array(ex.sets || 1).fill(false), weight: "", notes: "", done: false };
    }
  }
  return state;
}

function buildInitialPRs() {
  const prs = {};
  for (const day of Object.values(DAYS)) for (const ex of day.exercises) prs[ex.id] = 0;
  return prs;
}

function GymTracker() {
  const [activeTab, setActiveTab] = useState(DEFAULT_TAB);
  const [sessionState, setSessionState] = useState(buildInitialState());
  const [prs, setPrs] = useState(buildInitialPRs());
  const [expandedId, setExpandedId] = useState(null);
  const [sessionDone, setSessionDone] = useState(false);
  const [bannerDismissed, setBannerDismissed] = useState(false);
  const [loaded, setLoaded] = useState(false);
  const [newPRFlash, setNewPRFlash] = useState(null);

  useEffect(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const saved = JSON.parse(raw);
        if (saved.sessionState) {
          const merged = buildInitialState();
          for (const dayKey of Object.keys(merged)) {
            for (const exId of Object.keys(merged[dayKey])) {
              if (saved.sessionState[dayKey]?.[exId]) {
                merged[dayKey][exId] = saved.sessionState[dayKey][exId];
              }
            }
          }
          setSessionState(merged);
        }
        if (saved.prs) setPrs(saved.prs);
        if (saved.bannerDismissed) setBannerDismissed(saved.bannerDismissed);
        if (saved.activeTab && DAYS[saved.activeTab]) setActiveTab(saved.activeTab);
      }
    } catch (e) {}
    setLoaded(true);
  }, []);

  const save = useCallback((ss, p, bd) => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      const prevActiveTab = raw ? JSON.parse(raw).activeTab : undefined;
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ sessionState: ss, prs: p, bannerDismissed: bd, activeTab: prevActiveTab }));
    } catch (e) {}
  }, []);

  useEffect(() => {
    if (!loaded) return;
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      const parsed = raw ? JSON.parse(raw) : {};
      parsed.activeTab = activeTab;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(parsed));
    } catch (e) {}
  }, [activeTab, loaded]);

  useEffect(() => {
    if (!loaded) return;
    const dayData = sessionState[activeTab];
    const exercises = DAYS[activeTab].exercises;
    const allDone = exercises.every((ex) => dayData[ex.id]?.done);
    if (allDone && exercises.length > 0) setSessionDone(true);
  }, [sessionState, activeTab, loaded]);

  const color = DAYS[activeTab].color;

  function getProgress() {
    const dayData = sessionState[activeTab];
    const exs = DAYS[activeTab].exercises;
    const done = exs.filter((ex) => dayData[ex.id]?.done).length;
    return { done, total: exs.length };
  }

  function toggleSet(dayKey, exId, setIdx) {
    setSessionState((prev) => {
      const updated = { ...prev };
      const exState = { ...updated[dayKey][exId] };
      const sets = [...exState.sets];
      sets[setIdx] = !sets[setIdx];
      exState.sets = sets;
      exState.done = sets.every(Boolean);
      updated[dayKey] = { ...updated[dayKey], [exId]: exState };
      save(updated, prs, bannerDismissed);
      return updated;
    });
  }

  function markAllDone(dayKey, exId) {
    setSessionState((prev) => {
      const updated = { ...prev };
      const exState = { ...updated[dayKey][exId] };
      const allDone = exState.done;
      exState.sets = exState.sets.map(() => !allDone);
      exState.done = !allDone;
      updated[dayKey] = { ...updated[dayKey], [exId]: exState };
      save(updated, prs, bannerDismissed);
      return updated;
    });
  }

  function updateWeight(dayKey, exId, val) {
    setSessionState((prev) => {
      const updated = { ...prev };
      updated[dayKey] = { ...updated[dayKey], [exId]: { ...updated[dayKey][exId], weight: val } };
      const numVal = parseFloat(val);
      if (!isNaN(numVal) && numVal > 0) {
        const currentPR = prs[exId] || 0;
        if (numVal > currentPR) {
          const newPRs = { ...prs, [exId]: numVal };
          setPrs(newPRs);
          setNewPRFlash(exId);
          setTimeout(() => setNewPRFlash(null), 2000);
          save(updated, newPRs, bannerDismissed);
          return updated;
        }
      }
      save(updated, prs, bannerDismissed);
      return updated;
    });
  }

  function clearPR(exId) {
    setPrs((prev) => {
      const updated = { ...prev, [exId]: 0 };
      save(sessionState, updated, bannerDismissed);
      return updated;
    });
  }

  function updateNotes(dayKey, exId, val) {
    setSessionState((prev) => {
      const updated = { ...prev };
      updated[dayKey] = { ...updated[dayKey], [exId]: { ...updated[dayKey][exId], notes: val } };
      save(updated, prs, bannerDismissed);
      return updated;
    });
  }

  function resetDay() {
    setSessionState((prev) => {
      const updated = { ...prev };
      const fresh = buildInitialState();
      for (const ex of DAYS[activeTab].exercises) {
        fresh[activeTab][ex.id].weight = prev[activeTab][ex.id].weight;
        fresh[activeTab][ex.id].notes = prev[activeTab][ex.id].notes;
      }
      updated[activeTab] = fresh[activeTab];
      setSessionDone(false);
      save(updated, prs, bannerDismissed);
      return updated;
    });
  }

  function dismissBanner() { setBannerDismissed(true); save(sessionState, prs, true); }

  if (!loaded) return (
    <div style={{ background: "#1A1917", minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center" }}>
      <div style={{ color: "#7A7468", fontFamily: "monospace", fontSize: 14 }}>Loading...</div>
    </div>
  );

  const { done, total } = getProgress();
  const progressPct = total > 0 ? (done / total) * 100 : 0;

  return (
    <div style={{ background: "#1A1917", minHeight: "100vh", fontFamily: "'JetBrains Mono', 'Courier New', monospace", color: "#C7C1B8", position: "relative", paddingBottom: bannerDismissed ? 16 : 72 }}>
      <div style={{ padding: "20px 16px 0", borderBottom: "1px solid #322F2A", paddingTop: "max(20px, env(safe-area-inset-top))" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 16 }}>
          <div>
            <div style={{ fontFamily: "'JetBrains Mono', monospace", fontWeight: 800, fontSize: 24, letterSpacing: 0.5, color: color, lineHeight: 1 }}>IRON LOG</div>
            <div style={{ fontSize: 10, color: "#6B655B", letterSpacing: 2, marginTop: 2 }}>
              {new Date().toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "short" }).toUpperCase()}
            </div>
          </div>
          <button onClick={resetDay} style={{ background: "transparent", border: "1px solid #3A3733", color: "#7A7468", borderRadius: 6, padding: "6px 12px", fontSize: 11, letterSpacing: 1, cursor: "pointer", fontFamily: "inherit" }}>RESET DAY</button>
        </div>
        <div style={{ display: "flex", gap: 4 }}>
          {Object.entries(DAYS).map(([key, day]) => (
            <button key={key} className="tab-btn" onClick={() => { setActiveTab(key); setSessionDone(false); setExpandedId(null); }}
              style={{ flex: 1, padding: "10px 4px", borderRadius: "8px 8px 0 0", color: activeTab === key ? "#1A1917" : "#6B655B", background: activeTab === key ? day.color : "#211F1C", fontFamily: "inherit", fontSize: 11, fontWeight: 500, letterSpacing: 1, borderBottom: activeTab === key ? `2px solid ${day.color}` : "2px solid #322F2A" }}>
              <div style={{ fontFamily: "'JetBrains Mono', monospace", fontWeight: 700, fontSize: 13, letterSpacing: 0.5 }}>{day.label}</div>
              <div style={{ fontSize: 10, opacity: 0.85, marginTop: 1 }}>{day.short}</div>
            </button>
          ))}
        </div>
      </div>

      <div style={{ padding: "8px 16px", background: "#201F1C", borderBottom: "1px solid #322F2A" }}>
        <span style={{ fontSize: 11, color: color, letterSpacing: 0.5 }}>{DAYS[activeTab].subtitle}</span>
      </div>

      <div style={{ padding: "12px 16px 8px", background: "#201F1C" }}>
        <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
          <span style={{ fontSize: 10, color: "#7A7468", letterSpacing: 1 }}>PROGRESS</span>
          <span style={{ fontSize: 10, color: color, letterSpacing: 1 }}>{done}/{total}</span>
        </div>
        <div style={{ height: 3, background: "#322F2A", borderRadius: 2, overflow: "hidden" }}>
          <div style={{ height: "100%", width: `${progressPct}%`, background: color, borderRadius: 2, transition: "width 0.4s cubic-bezier(0.4,0,0.2,1)" }} />
        </div>
      </div>

      <div style={{ padding: "8px 0" }}>
        {DAYS[activeTab].exercises.map((ex) => {
          const exState = sessionState[activeTab][ex.id];
          const isExpanded = expandedId === ex.id;
          const isPR = newPRFlash === ex.id;
          const hasPR = prs[ex.id] > 0 && parseFloat(exState.weight) >= prs[ex.id];
          const setsCount = ex.sets || 1;
          return (
            <div key={ex.id} style={{ borderBottom: "1px solid #2A2825" }}>
              <div className="ex-row" style={{ display: "flex", alignItems: "center", padding: "12px 16px", background: exState.done ? "#201F1C" : "transparent", gap: 12, cursor: "pointer" }} onClick={() => setExpandedId(isExpanded ? null : ex.id)}>
                <div className="circle-btn" onClick={(e) => { e.stopPropagation(); markAllDone(activeTab, ex.id); }}
                  style={{ width: 28, height: 28, borderRadius: "50%", border: `2px solid ${exState.done ? color : "#3E3A34"}`, background: exState.done ? color : "transparent", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, transition: "all 0.2s" }}>
                  {exState.done && (<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-5" stroke="#1A1917" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>)}
                </div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 13, fontWeight: 500, color: exState.done ? "#6B655B" : "#C7C1B8", textDecoration: exState.done ? "line-through" : "none", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis", letterSpacing: 0.3, animation: isPR ? "prFlash 0.4s ease 3" : "none" }}>{ex.name}</div>
                  <div style={{ display: "flex", gap: 6, marginTop: 3, alignItems: "center" }}>
                    <span style={{ fontSize: 9, padding: "1px 5px", borderRadius: 3, background: `${TYPE_COLORS[ex.type]}22`, color: TYPE_COLORS[ex.type], letterSpacing: 1, fontWeight: 500 }}>{ex.type}</span>
                    {ex.sets && ex.reps && <span style={{ fontSize: 10, color: "#6B655B" }}>{ex.sets}×{ex.reps}</span>}
                    {!ex.sets && ex.reps && <span style={{ fontSize: 10, color: "#6B655B" }}>{ex.reps}</span>}
                    {hasPR && (<span style={{ fontSize: 11, animation: isPR ? "pulse 0.3s ease 4" : "none" }}>🏆</span>)}
                    {exState.notes && (<span style={{ fontSize: 10, color: "#6B655B" }}>📝</span>)}
                  </div>
                </div>
                {exState.weight && (<div style={{ fontSize: 12, color: color, letterSpacing: 0.5, flexShrink: 0 }}>{exState.weight}kg</div>)}
                <div style={{ color: "#5A554C", transform: isExpanded ? "rotate(180deg)" : "rotate(0deg)", transition: "transform 0.2s", fontSize: 12 }}>▾</div>
              </div>
              {isExpanded && (
                <div style={{ padding: "0 16px 16px", background: "#1D1C19", animation: "slideUp 0.15s ease" }}>
                  {EXERCISE_MEDIA[ex.id] && (
                    <div style={{ padding: "8px 0 14px", display: "flex", justifyContent: "center" }}>
                      <div style={{ width: "100%", maxWidth: 320, aspectRatio: "1", borderRadius: 12, overflow: "hidden", border: `1px solid ${color}33`, background: "#fff" }}>
                        <img
                          src={EXERCISE_MEDIA[ex.id]}
                          alt={ex.name}
                          loading="lazy"
                          onError={(e) => { e.target.parentElement.style.display = "none"; }}
                          style={{ display: "block", width: "100%", height: "100%", objectFit: "contain" }}
                        />
                      </div>
                    </div>
                  )}
                  {ex.sets && (
                    <div style={{ display: "flex", gap: 8, marginBottom: 12, flexWrap: "wrap", paddingTop: EXERCISE_MEDIA[ex.id] ? 0 : 14 }}>
                      {Array.from({ length: setsCount }).map((_, i) => (
                        <button key={i} className="set-btn" onClick={() => toggleSet(activeTab, ex.id, i)}
                          style={{ padding: ex.setLabels ? "8px 14px" : "8px 0", width: ex.setLabels ? "auto" : 52, borderRadius: 8, fontSize: 11, fontFamily: "inherit", letterSpacing: 1, background: exState.sets[i] ? color : "#262420", color: exState.sets[i] ? "#1A1917" : "#7A7468", border: `1px solid ${exState.sets[i] ? color : "#3A3733"}` }}>{ex.setLabels ? ex.setLabels[i] : `S${i + 1}`}</button>
                      ))}
                    </div>
                  )}
                  {ex.type === "STR" && (
                    <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                      <span style={{ fontSize: 10, color: "#6B655B", letterSpacing: 1 }}>WEIGHT</span>
                      <input type="number" inputMode="decimal" placeholder="0" value={exState.weight} onChange={(e) => updateWeight(activeTab, ex.id, e.target.value)} onClick={(e) => e.stopPropagation()}
                        style={{ background: "#262420", border: `1px solid ${isPR ? color : "#3A3733"}`, borderRadius: 8, padding: "8px 12px", color: color, fontSize: 14, fontFamily: "inherit", width: 90, outline: "none", transition: "border 0.2s" }} />
                      <span style={{ fontSize: 11, color: "#6B655B" }}>kg</span>
                      {prs[ex.id] > 0 && (
                        <span style={{ fontSize: 10, color: "#6B655B", marginLeft: "auto", display: "flex", alignItems: "center", gap: 8 }}>
                          PR: {prs[ex.id]}kg
                          <span onClick={(e) => { e.stopPropagation(); clearPR(ex.id); }} style={{ color: "#9C6B5C", textDecoration: "underline", cursor: "pointer" }}>CLEAR</span>
                        </span>
                      )}
                    </div>
                  )}
                  <div style={{ marginTop: 12 }}>
                    <div style={{ fontSize: 10, color: "#6B655B", letterSpacing: 1, marginBottom: 6 }}>NOTES</div>
                    <textarea placeholder="e.g. felt heavy, switch grip next time..." value={exState.notes} onChange={(e) => updateNotes(activeTab, ex.id, e.target.value)} onClick={(e) => e.stopPropagation()} rows={2}
                      style={{ width: "100%", background: "#262420", border: "1px solid #3A3733", borderRadius: 8, padding: "8px 10px", color: "#B0AA9F", fontSize: 12, fontFamily: "inherit", outline: "none", resize: "vertical", lineHeight: 1.4 }} />
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>

      {sessionDone && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(13,13,13,0.97)", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", zIndex: 100, animation: "fadeIn 0.3s ease" }}>
          <div style={{ fontSize: 72, marginBottom: 16, animation: "pulse 1s ease infinite" }}>🔥</div>
          <div style={{ fontFamily: "'JetBrains Mono', monospace", fontWeight: 800, fontSize: 34, color: color, letterSpacing: 1, textAlign: "center" }}>SESSION<br/>DONE</div>
          <div style={{ color: "#6B655B", fontSize: 12, letterSpacing: 2, marginTop: 12 }}>{DAYS[activeTab].label} — {DAYS[activeTab].subtitle}</div>
          <button onClick={() => setSessionDone(false)} style={{ marginTop: 40, background: color, border: "none", borderRadius: 12, padding: "14px 40px", color: "#1A1917", fontSize: 13, fontFamily: "inherit", fontWeight: 700, letterSpacing: 1, cursor: "pointer" }}>CLOSE</button>
        </div>
      )}

      {!bannerDismissed && (
        <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, background: "#211F1C", borderTop: "1px solid #322F2A", padding: "10px 16px", paddingBottom: "max(10px, env(safe-area-inset-bottom))", display: "flex", alignItems: "center", gap: 10, zIndex: 50, animation: "slideUp 0.3s ease" }}>
          <span style={{ fontSize: 11, color: "#7A7468", flex: 1, letterSpacing: 0.3 }}>📱 Share ↑ → Add to Home Screen</span>
          <button onClick={dismissBanner} style={{ background: "transparent", border: "none", color: "#6B655B", fontSize: 18, cursor: "pointer", padding: "0 4px", lineHeight: 1 }}>×</button>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<GymTracker />);
</script>
</body>
</html>
